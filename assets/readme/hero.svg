<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">aigc — local ComfyUI creation workbench</title>
  <desc id="desc">A violet desktop-workflow board showing inputs moving through an Electron proxy to separate image and video ComfyUI services.</desc>
  <rect width="1200" height="360" rx="28" fill="#191329"/>
  <path d="M54 75H1146" stroke="#4a3d73" stroke-width="2"/>
  <text x="58" y="64" fill="#75e3db" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">LOCAL CREATION WORKBENCH / COMFYUI MADE OPERABLE</text>
  <text x="58" y="136" fill="#faf7ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="60" font-weight="700">aigc</text>
  <text x="61" y="179" fill="#d8cff0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="26">把本地生成工作流封装成清晰的桌面任务</text>
  <text x="61" y="211" fill="#aa9fc8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21">Choose a mode, validate inputs, and run image or video workflows locally.</text>
  <text x="61" y="258" fill="#75e3db" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">ELECTRON · COMFYUI · FUNASR · VUE</text>
  <g transform="translate(655 70)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="22" width="115" height="150" rx="19" fill="#2b2144" stroke="#7b6db4" stroke-width="2"/>
    <text x="24" y="55" fill="#faf7ff" font-size="16" font-weight="700">INPUTS</text><rect x="16" y="71" width="83" height="23" rx="7" fill="#443667"/><text x="27" y="87" fill="#d8cff0" font-size="12">mode + prompt</text>
    <path d="M17 120c9-20 18 20 27 0s18 20 27 0 18 20 27 0" fill="none" stroke="#75e3db" stroke-width="4" stroke-linecap="round"/><text x="18" y="149" fill="#a99dcc" font-size="12">voice + image</text>
    <path d="M130 97H154" stroke="#75e3db" stroke-width="4"/><polygon points="154,97 142,89 142,105" fill="#75e3db"/>
    <rect x="154" y="50" width="137" height="95" rx="19" fill="#342857" stroke="#aa9fed" stroke-width="2"/>
    <text x="181" y="85" fill="#faf7ff" font-size="16" font-weight="700">ELECTRON</text><text x="185" y="109" fill="#d8cff0" font-size="13">proxy + IPC</text><text x="175" y="130" fill="#75e3db" font-size="13">inject workflow</text>
    <path d="M305 76H333M305 119H333" stroke="#75e3db" stroke-width="4"/><polygon points="333,76 321,68 321,84" fill="#75e3db"/><polygon points="333,119 321,111 321,127" fill="#75e3db"/>
    <rect x="333" y="38" width="144" height="58" rx="17" fill="#264a58" stroke="#75e3db" stroke-width="2"/><text x="370" y="72" fill="#e6fffc" font-size="16" font-weight="700">IMAGE</text>
    <rect x="333" y="108" width="144" height="58" rx="17" fill="#513254" stroke="#d6a2c1" stroke-width="2"/><text x="371" y="142" fill="#fff1fb" font-size="16" font-weight="700">VIDEO</text>
    <text x="170" y="214" fill="#aa9fc8" font-size="14">submit → history → saved result</text>
  </g>
</svg>
